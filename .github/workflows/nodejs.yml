name: Node CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
      # The prepare lifecycle builds only the library.
      - run: npm ci
      - run: npm test
      - run: npm run build:examples
      - run: npm run test:build
      - name: Pack built library
        run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: magic-snowflakes-*.tgz
          if-no-files-found: error
