<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <meta name="format-detection" content="telephone=no"/>
    <title>Layer</title>
    <style>
        #layer {
            position: fixed;
            left: 50%;
            top: 50%;
            margin-top: -150px;
            margin-left: -150px;
            width: 300px;
            height: 300px;
            border: 1px solid #eee;
            overflow: hidden;
        }
    </style>
    <link rel="stylesheet" href="examples.css" />
</head>
<body data-example="layer">
    <script src="../dist/snowflakes.js"></script>
    <script src="examples.js"></script>
    <div id="layer"></div>
    <script>
        var snowfall = new Snowflakes({ container: document.querySelector('#layer') });
        ExamplePage.setInstances([snowfall]);
    </script>
</body>
</html>
