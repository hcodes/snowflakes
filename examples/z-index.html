<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <meta name="format-detection" content="telephone=no"/>
    <title>Own z-index</title>
    <style>
        #top-layer,
        #bottom-layer {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 300px;
            height: 300px;
            vertical-align: middle;
            line-height: 300px;
            text-align: center;
        }

        #top-layer {
            z-index: 100000;
            background: rgb(255, 100, 100);
            margin-top: -150px;
        }

        #bottom-layer {
            z-index: 10;
            background: rgb(100, 100, 255);
            margin-top: -150px;
            margin-left: -300px;
        }
    </style>
    <link rel="stylesheet" href="examples.css" />
</head>
<body data-example="z-index">
    <div data-example-controls>
        <label for="snow-position">Snow position</label>
        <select id="snow-position">
            <option value="5">Behind both panels</option>
            <option value="90000" selected>Between panels</option>
            <option value="100001">In front of both panels</option>
        </select>
    </div>
    <div id="top-layer">z-index: 100000</div>
    <div id="bottom-layer">z-index: 10</div>
    <script src="../dist/snowflakes.js"></script>
    <script src="examples.js"></script>
    <script>
        var snowfall = new Snowflakes({ zIndex: 90000 });
        ExamplePage.setInstances([snowfall]);
        document.getElementById('snow-position').addEventListener('change', function (event) {
            snowfall.setParams({ zIndex: Number(event.target.value) });
        });
    </script>
</body>
</html>
